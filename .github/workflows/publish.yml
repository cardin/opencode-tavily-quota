name: Publish

on:
  release:
    types: [published]

# Trusted publishing: the id-token lets npm exchange the GitHub OIDC token for
# a short-lived publish credential, so no NPM_TOKEN secret is stored. Provenance
# is attached automatically.
permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in release builds

      - name: Verify release tag matches package.json version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG#v}" != "$pkg" ]; then
            echo "::error::Release tag '${RELEASE_TAG}' does not match package.json version '${pkg}'"
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      # prepublishOnly runs the build, so dist/ is produced here.
      - run: npm publish
